<!DOCTYPE html> 
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waraich Rice and Flour Mills</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
    }

    /* ذرات کا کینوس مکمل پس منظر میں، ٹیکسٹ کے پیچھے */
    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* اوپر اور درمیان والا سفید مواد */
    .main-content {
      position: relative;
      z-index: 1;
      padding: 64px 24px 48px;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    .badge {
      font-size: 13px;
      letter-spacing: 1px;
      color: #555555;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 40px;
      font-weight: 700;
      color: #0b0b0b;
      margin-bottom: 16px;
    }

    .bio {
      font-size: 17px;
      line-height: 1.7;
      color: #262626;
      max-width: 620px;
    }

    /* نیچے الگ سیاہ کانٹیکٹ سیکشن */
    .contact-box {
      position: relative;
      z-index: 1;
      background-color: #0e0e0e;
      color: #ffffff;
      padding: 36px 24px;
      margin-top: 40px;
      border-top: 2px solid #222222;
    }

    .contact-inner {
      max-width: 780px;
      margin: 0 auto;
    }

    .contact-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #ffffff;
    }

    .contact-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .contact-list a {
      display: inline-block;
      color: #ffffff;
      background-color: #1b1b1b;
      border: 1px solid #333333;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .contact-list a:hover {
      background-color: #2a2a2a;
      border-color: #666666;
    }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <main class="main-content">
    <p class="badge">سرتیفائیڈ بائی چودھری</p>
    <h1>Waraich Rice and Flour Mills</h1>
    <p class="bio">
      خوش آمدید۔ یہ صفحہ سفید پس منظر پر تیار کیا گیا ہے جس کے پیچھے ذرات حرکت کر رہے ہیں، اور رابطے کی معلومات نیچے الگ سیاہ سیکشن میں دی گئی ہیں۔
    </p>
  </main>

  <section class="contact-box" id="contact">
    <div class="contact-inner">
      <h2 class="contact-title">رابطہ کی تفصیلات</h2>
      <ul class="contact-list">
        <li><a href="https://wa.me/" target="_blank" rel="noopener noreferrer">WhatsApp</a></li>
        <li><a href="mailto:example@example.com">Email</a></li>
        <li><a href="https://instagram.com/iunknownmguy" target="_blank" rel="noopener noreferrer">Instagram (@iunknownmguy)</a></li>
      </ul>
    </div>
  </section>

  <script>
    const canvas = document.getElementById("particles-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticles() {
      const count = Math.min(65, Math.floor((window.innerWidth * window.innerHeight) / 18000));
      particles = Array.from({ length: Math.max(25, count) }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.5 + 1,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        alpha: Math.random() * 0.35 + 0.15
      }));
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(30, 30, 30, ${p.alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(drawParticles);
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      createParticles();
    });

    resizeCanvas();
    createParticles();
    drawParticles();
  </script>
</body>
</html>
